<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #2C3E50;
            margin-bottom: 10px;
        }

        p {
            color: #7F8C8D;
            font-size: 1rem;
            margin: 5px 0;
        }

        /* Contact Box Styling */
        .contact-box {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .contact-box p {
            margin-bottom: 15px;
        }

        .contact-box strong {
            font-weight: 600;
        }

        /* Button Styling */
        a {
            display: inline-block;
            background-color: #1ABC9C;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 500;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        a:hover {
            background-color: #16A085;
        }

    </style>
</head>
<body>
<div class="contact-box">
    <h1>Contact Support</h1>
    <p>If you're facing issues, feel free to reach out to us.</p>
    <p><strong>Email:</strong> support@agridrone.com</p>
    <p><strong>Phone:</strong> +91 98765 43210</p>
    <p><strong>Support Hours:</strong> Mon - Fri (9 AM - 6 PM)</p>
    <a href="mailto:support@agridrone.com">Email Us</a>
</div>
</body>
</html>
